name: Upstream Sync
on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0点运行，可按需调整
  workflow_dispatch: # 保留手动触发按钮

permissions:
  contents: write # 必须要有写权限才能推送同步

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.repository.fork # 仅 Fork 仓库生效
    steps:
      - uses: actions/checkout@v4
      - name: Sync upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: morluto/rea
          upstream_sync_branch: main  # 上游分支
          target_sync_branch: main    # 你的 Fork 分支
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
